[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "znapzend-full"
version = "0.1.0"
description = "A comprehensive wrapper around znapzend for full system backup/restore"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "John Stucklen", email = "stuckj@gmail.com"}
]
keywords = ["zfs", "backup", "znapzend", "system-backup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "PyYAML>=6.0",
    "dbus-python>=1.3.2",
    "PyQt6>=6.4.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
znapzend-full-ctl = "znapzend_full.cli.ctl:main"
znapzend-full-restore = "znapzend_full.restore.interactive:main"
znapzend-full-tray = "znapzend_full.ui.tray:main"
znapzend-full-dbus-service = "znapzend_full.dbus_service:main"

[project.gui-scripts]
znapzend-full-tray-gui = "znapzend_full.ui.tray:main"

[project.urls]
Homepage = "https://github.com/stuckj/znapzend-full"
Documentation = "https://github.com/stuckj/znapzend-full#readme"
Repository = "https://github.com/stuckj/znapzend-full.git"
Issues = "https://github.com/stuckj/znapzend-full/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"znapzend_full.ui.resources" = ["icons/*.svg", "icons/LICENSE"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
