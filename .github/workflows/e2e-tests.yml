name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with tmate debugging'
        required: false
        default: 'false'

# Ensure only one E2E run at a time (resource-intensive)
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check virtualization support
        run: |
          echo "Checking CPU virtualization support..."
          if grep -qE '(vmx|svm)' /proc/cpuinfo; then
            echo "✓ Hardware virtualization supported"
          else
            echo "⚠ Hardware virtualization may not be available"
          fi

          # Check KVM availability
          if [ -e /dev/kvm ]; then
            echo "✓ KVM device exists"
            ls -la /dev/kvm
          else
            echo "⚠ KVM device not found"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            libguestfs-tools \
            cloud-image-utils \
            genisoimage \
            bridge-utils \
            iproute2 \
            python3-pip \
            python3-venv

          # Enable KVM access for the runner user
          sudo chmod 666 /dev/kvm || echo "Could not chmod /dev/kvm"

      - name: Cache base image
        uses: actions/cache@v4
        with:
          path: ~/.cache/znapzend-full-e2e
          key: e2e-base-image-${{ hashFiles('tests/e2e/images/build_base_image.sh') }}-v1
          restore-keys: |
            e2e-base-image-

      - name: Build base image
        run: |
          cd tests/e2e/images
          make image
        env:
          CACHE_DIR: ~/.cache/znapzend-full-e2e

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install paramiko jinja2 pytest-timeout pyyaml

      - name: Set up networking
        run: |
          # Create bridge for VM networking
          sudo ip link add znapzend-e2e-br0 type bridge || true
          sudo ip addr add 10.100.0.1/24 dev znapzend-e2e-br0 || true
          sudo ip link set znapzend-e2e-br0 up

          # Enable IP forwarding for NAT
          sudo sysctl -w net.ipv4.ip_forward=1

          # Set up NAT
          sudo iptables -t nat -A POSTROUTING -s 10.100.0.0/24 -j MASQUERADE || true

          # Verify setup
          ip addr show znapzend-e2e-br0

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ \
            -v \
            --tb=long \
            --timeout=1200 \
            --timeout-method=signal \
            -x \
            --log-cli-level=INFO \
            --log-file=/tmp/e2e-pytest.log \
            --log-file-level=DEBUG
        env:
          E2E_WORK_DIR: /tmp/znapzend-e2e
          E2E_IMAGE_CACHE: ~/.cache/znapzend-full-e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p artifacts

          # Copy pytest log
          cp /tmp/e2e-pytest.log artifacts/ 2>/dev/null || true

          # Copy VM console logs
          find /tmp/znapzend-e2e -name "console.log" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Copy cloud-init logs if available
          find /tmp/znapzend-e2e -name "user-data" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Create archive
          tar -czf artifacts/e2e-logs.tar.gz artifacts/ 2>/dev/null || true

          # Print logs for inline viewing
          echo "=== Pytest Log ==="
          cat /tmp/e2e-pytest.log 2>/dev/null || echo "No pytest log"

          echo "=== VM Console Logs ==="
          for log in /tmp/znapzend-e2e/*/console.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              tail -100 "$log"
            fi
          done

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: artifacts/
          retention-days: 7

      - name: Debug with tmate
        if: ${{ failure() && github.event.inputs.debug_enabled == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30

      - name: Cleanup networking
        if: always()
        run: |
          # Remove NAT rule
          sudo iptables -t nat -D POSTROUTING -s 10.100.0.0/24 -j MASQUERADE 2>/dev/null || true

          # Remove bridge
          sudo ip link set znapzend-e2e-br0 down 2>/dev/null || true
          sudo ip link del znapzend-e2e-br0 2>/dev/null || true

          # Kill any remaining QEMU processes
          pkill -9 qemu-system-x86 2>/dev/null || true

  # Unit tests job (runs in parallel)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/e2e/ \
            -v \
            --tb=short \
            --cov=src/znapzend_full \
            --cov-report=term-missing

      - name: Run linting
        run: |
          ruff check src/ tests/
          black --check src/ tests/
